
<div class="row bg-light" style="--bs-gutter-x: 0 !important; border-top: solid 1px gainsboro;">
    <div class="col col-10 d-flex justify-content-between p-3">
        <div>
            <div>
                
                <h3><i class="fa fa-shopping-basket"></i> {{cantidadArticulos}} Productos en la venta actual.</h3>
            </div>
            <div class="d-flex">
                <button tabindex="-1" class="btn btn-outline-secondary mr-2" [disabled]="idVentaActivaInterno == '' || ventasActuales.length <= 1 || eliminandoVenta || cambiandoDeVenta" (click)="mostrarListaVentas()"><span class="functionKeys">F5</span><i class="fa fa-refresh"></i> Cambiar</button>
                <button tabindex="-1" class="btn btn-outline-secondary mr-2" [disabled]="eliminandoVenta || cambiandoDeVenta" (click)="crearNuevaVenta()"><span class="functionKeys">F6</span><i class="fa fa-plus"></i> Nueva venta</button>
                <button tabindex="-1" class="btn btn-outline-secondary" [disabled]="idVentaActivaInterno == '' || eliminandoVenta || cambiandoDeVenta" (click)="eliminarVentaActiva()"><i *ngIf="eliminandoVenta; else iconoEliminar" class="fa fa-spinner fa-pulse"></i><ng-template #iconoEliminar><i class="fa fa-trash"></i></ng-template> Eliminar</button>
            </div>
        </div>
        <div>
            <button tabindex="-1" class="btn btn-primary h-100" [disabled]="idVentaActivaInterno == '' || ventaTotalPesos == 0 || eliminandoVenta" (click)="cobrarVenta()"><span class="functionKeys">F12</span><i class="fa fa-shopping-cart"></i> Cobrar</button>
        </div>
    </div>
    <div class="col col-2 p-2 totalVentaPesos">
        {{ventaTotalPesos | currency: '$'}}
    </div>
</div>

<!-- MODAL PARA SELECCION DE VENTA -->
<div style="display: none;"> 
    <div #modalSeleccionVenta>
        <app-seleccionar-venta></app-seleccionar-venta>    
    </div>
</div>

<!-- MODAL PARA COBRAR UNA VENTA -->
<div style="display: none;"> 
    <div #modalCobrarVenta>
      <app-cobrar-venta [ventaTotalPesos] = ventaTotalPesos [cantidadArticulos] = cantidadArticulos [idVentaActiva] = idVentaActiva [idVentaActivaInterno] = idVentaActivaInterno [productosVentaActual] = productosVentaActual (obtenerVentasActivas) = obtenerVentasActivas.emit($event)></app-cobrar-venta>    
    </div>
  </div>
