<div class="nuevo-producto-container animated fadeIn faster">
  <!-- Header -->
  <div class="header-nuevo-producto">
    <div class="titulo-seccion">
      <i class="fa" [ngClass]="!esModificacion ? 'fa-plus-circle' : 'fa-edit'"></i>
      <h3 *ngIf="!esModificacion">Nuevo producto</h3>
      <h3 *ngIf="esModificacion">Modificar producto</h3>
    </div>
  </div>

  <div class="contenido-formulario">
    
    <!-- Búsqueda de producto (solo en modo modificación) -->
    <form *ngIf="esModificacion" (submit)="buscarProductoPorCodigoDeBaras()" class="seccion-busqueda">
      <div class="grupo-busqueda">
        <div class="input-wrapper">
          <i class="fa fa-barcode icono-input"></i>
          <input type="text" 
                 class="input-buscar-producto" 
                 [(ngModel)] = "buscarProducto.palabraClave" 
                 name="codigoDeProducto" 
                 id="codigoDeProducto" 
                 #codigoDeProducto 
                 placeholder="Código del producto" 
                 autocomplete="off">
        </div>
        <button class="btn-buscar-producto" (click)="buscarProductoPorCodigoDeBaras()" type="button">
          <i class="fa fa-search"></i> Buscar
        </button>
      </div>
    </form>

    <!-- Formulario principal -->
    <form [formGroup] = "formulario" (ngSubmit) = "guardar()" class="formulario-producto">
      
      <!-- Campo Código de Barras -->
      <div class="campo-formulario">
        <label class="etiqueta-campo">Código de barras <span class="texto-opcional">(opcional)</span></label>
        <div class="input-wrapper">
          <i class="fa fa-barcode icono-input"></i>
          <input type="text"
                 class="input-campo"
                 formControlName="codigoDeBarras"
                 name="codigoDeBarras"
                 id="codigoDeBarras"
                 autocomplete="off"
                 placeholder="Dejar vacío para generar automáticamente">
        </div>
      </div>

      <!-- Campo Descripción -->
      <div class="campo-formulario">
        <label class="etiqueta-campo">Descripción</label>
        <div class="input-wrapper">
          <i class="fa fa-tag icono-input"></i>
          <input type="text"
                 class="input-campo"
                 formControlName="descripcion"
                 name="descripcion"
                 autocomplete="off"
                 required>
        </div>
      </div>

      <!-- Campo Se Vende -->
      <div class="campo-formulario">
        <label class="etiqueta-campo">Se vende</label>
        <div class="botones-tipo-venta">
          <button [ngClass]="{'btn-tipo-activo': formulario.controls['seVende'].value == 1, 'btn-tipo': formulario.controls['seVende'].value != 1}" 
                  type="button" 
                  (click)="setSeVende(1)">
            <i class="fa fa-cube"></i>
            <span>Por unidad / pieza</span>
          </button>
          
          <button [ngClass]="{'btn-tipo-activo': formulario.controls['seVende'].value == 2, 'btn-tipo': formulario.controls['seVende'].value != 2}" 
                  type="button" 
                  (click)="setSeVende(2)">
            <i class="fa fa-balance-scale"></i>
            <span>A granel</span>
          </button>
          
          <button [ngClass]="{'btn-tipo-activo': formulario.controls['seVende'].value == 3, 'btn-tipo': formulario.controls['seVende'].value != 3}" 
                  type="button" 
                  (click)="setSeVende(3)">
            <i class="fa fa-cubes"></i>
            <span>Como paquete (kit)</span>
          </button>
        </div>
      </div>

      <!-- Campo Precio Costo -->
      <div class="campo-formulario">
        <label class="etiqueta-campo">Precio costo</label>
        <div class="input-wrapper-moneda">
          <span class="simbolo-moneda">$</span>
          <input type="number"
                 class="input-campo-moneda"
                 formControlName="precioCosto"
                 name="precioCosto"
                 (keyup) = "validarCosto($event)"
                 required>
        </div>
      </div>

      <!-- Campo Ganancia -->
      <div class="campo-formulario">
        <label class="etiqueta-campo">Ganancia</label>
        <div class="input-wrapper-porcentaje">
          <input type="number"
                 class="input-campo-porcentaje"
                 formControlName="ganancia"
                 name="ganancia"
                 (keyup) = "calcularPrecioVenta($event)"
                 required>
          <span class="simbolo-porcentaje">%</span>
        </div>
      </div>

      <!-- Campo Precio Venta -->
      <div class="campo-formulario">
        <label class="etiqueta-campo">Precio venta</label>
        <div class="input-wrapper-moneda">
          <span class="simbolo-moneda">$</span>
          <input type="number"
                 class="input-campo-moneda"
                 formControlName="precioVenta"
                 name="precioVenta"
                 (keyup) = "calcularGanancia($event)"
                 required>
        </div>
      </div>

      <!-- Campo Precio Mayoreo -->
      <div class="campo-formulario">
        <label class="etiqueta-campo">Precio mayoreo</label>
        <div class="input-wrapper-moneda">
          <span class="simbolo-moneda">$</span>
          <input type="number"
                 class="input-campo-moneda"
                 formControlName="precioMayoreo"
                 name="precioMayoreo"
                 required>
        </div>
      </div>

      <!-- Campo Departamento -->
      <div class="campo-formulario">
        <label class="etiqueta-campo">Departamento</label>
        <div class="input-wrapper">
          <i class="fa fa-folder icono-input"></i>
          <select #departamentos 
                  id="departamentos" 
                  (change)="setDepartamento(departamentos.value)" 
                  class="select-campo"
                  formControlName="departamento"
                  name="departamento">
            <option value="0" [selected]>- Sin departamento -</option>
            <option *ngFor="let departamento of deptos; let i = index" [value]=departamento.id>{{ departamento.nombre }}</option>
            <option value="-1">+ Agregar nuevo</option>
          </select>
        </div>

        <input type="text"
               class="input-campo mt-3"
               autocomplete="off"
               placeholder="Nombre de nuevo departamento"
               id="nuevoDepartamento"
               hidden>
      </div>

      <!-- Mensaje de error -->
      <div *ngIf="formularioInvalido" class="mensaje-error">
        <i class="fa fa-exclamation-circle"></i>
        Para continuar, debe llenar todos los campos del formulario.
      </div>

      <!-- Botón de guardar -->
      <div class="grupo-botones">
        <button type="submit" class="btn-guardar-producto">
          <span *ngIf="!esModificacion">
            <i class="fa fa-save"></i> Guardar producto
          </span>
          <span *ngIf="esModificacion">
            <i class="fa fa-save"></i> Actualizar
          </span>
        </button>
      </div>

    </form>
  </div>
</div>
