<div class="salida-dinero-container">
  <!-- Header -->
  <div class="header-modal">
    <div class="icono-header">
      <i class="fa fa-arrow-circle-up"></i>
    </div>
    <h3 class="titulo-header">Salida de Dinero</h3>
  </div>
  
  <form [formGroup]="formularioSalida" class="form-modal">
    <div class="campo-formulario">
      <label for="cantidadSalida" class="label-campo">
        <i class="fa fa-dollar"></i>
        Cantidad
      </label>
      <input 
        type="number" 
        class="input-campo" 
        id="cantidadSalida" 
        formControlName="cantidad"
        placeholder="0.00"
        step="0.01"
        min="0.01"
        autofocus>
    </div>

    <div class="campo-formulario">
      <label for="detalleSalida" class="label-campo">
        <i class="fa fa-pencil"></i>
        Detalles
      </label>
      <textarea 
        class="textarea-campo" 
        id="detalleSalida" 
        formControlName="detalle"
        rows="3"
        maxlength="200"
        placeholder="Describe el motivo de la salida de dinero"></textarea>
      <small class="contador-caracteres">{{formularioSalida.get('detalle')?.value?.length || 0}}/200 caracteres</small>
    </div>

    <div class="botones-accion">
      <button 
        type="button" 
        class="btn-modal-accion btn-guardar" 
        (click)="guardarSalida()"
        [disabled]="formularioSalida.invalid || guardando">
        <span class="tecla-modal">F2</span>
        <i *ngIf="guardando" class="fa fa-spinner fa-pulse"></i>
        <i *ngIf="!guardando" class="fa fa-save"></i>
        <span>Guardar</span>
      </button>
      <button 
        type="button" 
        class="btn-modal-accion btn-cancelar-accion" 
        (click)="cerrarModal()"
        [disabled]="guardando">
        <span class="tecla-modal">ESC</span>
        <i class="fa fa-times"></i>
        <span>Cancelar</span>
      </button>
    </div>
  </form>

  <div class="separador"></div>

  <div class="salidas-pasadas-section">
    <button 
      type="button" 
      class="btn-toggle-lista" 
      (click)="toggleMostrarSalidas()">
      <i class="fa" [ngClass]="mostrarSalidas ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
      <span>{{ mostrarSalidas ? 'Ocultar salidas' : 'Ver salidas pasadas' }}</span>
      <span class="badge-contador">{{ salidasPasadas.length }}</span>
    </button>

    <div *ngIf="mostrarSalidas" class="lista-registros animated fadeIn">
      <div *ngIf="salidasPasadas.length === 0" class="mensaje-vacio">
        <i class="fa fa-inbox"></i>
        <span>No hay salidas registradas hoy</span>
      </div>

      <div *ngIf="salidasPasadas.length > 0">
        <div 
          *ngFor="let salida of salidasPasadas; let i = index" 
          class="item-registro item-salida"
          [ngClass]="{'selected': salida.id === salidaSeleccionada}"
          (click)="seleccionarSalida(salida.id!)">
          
          <input 
            type="radio" 
            [id]="salida.id" 
            [value]="salida.id" 
            name="salidaRadio"
            [checked]="salida.id === salidaSeleccionada"
            class="radio-hidden">
          
          <label [for]="salida.id" class="label-registro">
            <div class="info-registro">
              <div class="cantidad-registro">
                <i class="fa fa-arrow-up"></i>
                <strong>${{ salida.cantidad.toFixed(2) }}</strong>
              </div>
              <div class="detalle-registro">
                {{ salida.detalle }}
              </div>
              <div class="fecha-registro">
                <i class="fa fa-clock-o"></i> 
                {{ salida.fecha.toDate() | date:'short' }}
              </div>
            </div>
          </label>
        </div>

        <div class="btn-eliminar-container">
          <button 
            type="button" 
            class="btn-eliminar-registro" 
            (click)="confirmarEliminarSalida()"
            [disabled]="!salidaSeleccionada || eliminando">
            <span class="tecla-modal">DEL</span>
            <i *ngIf="eliminando" class="fa fa-spinner fa-pulse"></i>
            <i *ngIf="!eliminando" class="fa fa-trash"></i>
            <span>Cancelar salida seleccionada</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
