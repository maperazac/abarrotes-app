<div class="salida-dinero-container">
  <h3><i class="fa fa-arrow-circle-up"></i> Salida de Dinero</h3>
  
  <form [formGroup]="formularioSalida">
    <div class="form-group">
      <label for="cantidadSalida">Cantidad ($)</label>
      <input 
        type="number" 
        class="form-control" 
        id="cantidadSalida" 
        formControlName="cantidad"
        placeholder="0.00"
        step="0.01"
        min="0.01"
        autofocus>
    </div>

    <div class="form-group mt-3">
      <label for="detalleSalida">Detalles</label>
      <textarea 
        class="form-control" 
        id="detalleSalida" 
        formControlName="detalle"
        rows="3"
        maxlength="200"
        placeholder="Describe el motivo de la salida de dinero"></textarea>
      <small class="text-muted">{{formularioSalida.get('detalle')?.value?.length || 0}}/200 caracteres</small>
    </div>

    <div class="botones-container mt-4">
      <button 
        type="button" 
        class="btn btn-primary" 
        (click)="guardarSalida()"
        [disabled]="formularioSalida.invalid || guardando">
        <span class="functionKeys">F2</span>
        <i *ngIf="guardando" class="fa fa-spinner fa-pulse"></i>
        <i *ngIf="!guardando" class="fa fa-save"></i>
        Guardar
      </button>
      <button 
        type="button" 
        class="btn btn-secondary" 
        (click)="cerrarModal()"
        [disabled]="guardando">
        <span class="functionKeys">ESC</span> <i class="fa fa-times"></i> Cancelar
      </button>
    </div>
  </form>

  <hr class="my-4">

  <div class="salidas-pasadas-section">
    <button 
      type="button" 
      class="btn btn-outline-primary btn-block mb-3" 
      (click)="toggleMostrarSalidas()">
      <i class="fa" [ngClass]="mostrarSalidas ? 'fa-eye-slash' : 'fa-eye'"></i>
      {{ mostrarSalidas ? 'Ocultar salidas' : 'Ver salidas pasadas' }} ({{ salidasPasadas.length }})
    </button>

    <div *ngIf="mostrarSalidas" class="salidas-lista animated fadeIn">
      <div *ngIf="salidasPasadas.length === 0" class="text-center text-muted py-3">
        <i class="fa fa-inbox"></i> No hay salidas registradas hoy
      </div>

      <div *ngIf="salidasPasadas.length > 0">
        <div 
          *ngFor="let salida of salidasPasadas; let i = index" 
          class="salida-item"
          [ngClass]="{'selected': salida.id === salidaSeleccionada, 'even': i % 2 === 0, 'odd': i % 2 !== 0}"
          (click)="seleccionarSalida(salida.id!)">
          
          <input 
            type="radio" 
            [id]="salida.id" 
            [value]="salida.id" 
            name="salidaRadio"
            [checked]="salida.id === salidaSeleccionada"
            class="salida-radio">
          
          <label [for]="salida.id" class="salida-label">
            <div class="salida-info">
              <div class="salida-cantidad">
                <strong>${{ salida.cantidad.toFixed(2) }}</strong>
              </div>
              <div class="salida-detalle">
                {{ salida.detalle }}
              </div>
              <div class="salida-fecha">
                <small class="text-muted">
                  <i class="fa fa-clock-o"></i> 
                  {{ salida.fecha.toDate() | date:'short' }}
                </small>
              </div>
            </div>
          </label>
        </div>

        <div class="mt-3">
          <button 
            type="button" 
            class="btn btn-danger btn-sm" 
            (click)="confirmarEliminarSalida()"
            [disabled]="!salidaSeleccionada || eliminando">
            <span class="functionKeys">DEL</span>
            <i *ngIf="eliminando" class="fa fa-spinner fa-pulse"></i>
            <i *ngIf="!eliminando" class="fa fa-trash"></i>
            Cancelar salida seleccionada
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
