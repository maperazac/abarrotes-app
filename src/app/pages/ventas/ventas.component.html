<div class="ventas-wrapper">
  <!-- Barra de búsqueda mejorada -->
  <div class="barra-busqueda">
    <div class="container-busqueda">
      <form (submit)="agregarProductoVentaActual(buscarProducto.palabraClave)" class="form-busqueda">
        <div class="input-wrapper">
          <i class="fa fa-barcode icono-busqueda"></i>
          <input 
            tabindex="-1" 
            [disabled]="idVentaActiva == 0" 
            type="text" 
            class="input-codigo" 
            [(ngModel)]="buscarProducto.palabraClave" 
            name="codigoDeProducto" 
            id="codigoDeProducto" 
            #codigoDeProducto 
            placeholder="Escanea o ingresa código del producto" 
            autocomplete="off">
          <button 
            tabindex="-1" 
            [disabled]="idVentaActiva == 0" 
            class="btn-agregar" 
            (click)="agregarProductoVentaActual(buscarProducto.palabraClave)" 
            type="button">
            <i class="fa fa-plus"></i>
            Agregar
          </button>
        </div>
      </form>
    </div>
  </div>

  <app-ventas-navbar (evento)="procesarEvento($event)"></app-ventas-navbar>

  <div class="contenedor-ventas animated fadeIn faster" [ngClass]="ventas.length == 0 ? 'sin-ventas' : ''">

  <!-- Pestañas de ventas mejoradas -->
  <ul class="pestanas-ventas" *ngIf="ventas.length > 0">
    <li class="pestana-item" *ngFor="let venta of ventas; let i = index">
      <button 
        class="pestana-btn" 
        [ngClass]="venta.id == idVentaActivaInterno && !cambiandoDeVenta ? 'active' : ''" 
        (click)="seleccionarComoVentaActiva(venta.idTemp, venta.id)">
        <i *ngIf="venta.id == idVentaActivaInterno && cambiandoDeVenta && duracionEnSegundos >= 1; else iconoTicket" 
           class="fa fa-spinner fa-pulse"></i>
        <ng-template #iconoTicket>
          <i class="fa fa-ticket"></i>
        </ng-template>
        <span class="pestana-nombre">{{ venta.nombre || venta.idTemp }}</span>
      </button>
    </li>
  </ul>

  <!-- Tabla de productos mejorada -->
  <div class="tabla-container" *ngIf="ventas.length > 0; else sinVentasActivas">
    <table class="tabla-productos">
      <thead>
        <tr>
          <th class="col-codigo">Código</th>
          <th class="col-descripcion">Descripción</th>
          <th class="col-precio">Precio Unit.</th>
          <th class="col-cantidad">Cantidad</th>
          <th class="col-importe">Importe</th>
        </tr>
      </thead>
    </table>
  </div>

  <ng-template #sinVentasActivas>
    <div class="estado-vacio" *ngIf="cargandoVentas; else noExistenVentasActivas">
      <div class="spinner-container">
        <i class="fa fa-spinner fa-pulse fa-3x"></i>
        <p>Cargando ventas actuales...</p>
      </div>
    </div>
    <ng-template #noExistenVentasActivas>
      <div class="estado-vacio">
        <div class="sin-ventas-mensaje">
          <i class="fa fa-shopping-cart fa-4x"></i>
          <h3>No hay ventas activas</h3>
          <p>Presiona <span class="functionKeys">F6</span> para iniciar una nueva venta</p>
        </div>
      </div>
    </ng-template>
  </ng-template>

  <!-- Lista de productos con scroll -->
  <div class="productos-scroll-container">
    <div *ngIf="!cambiandoDeVenta">
      <div *ngFor="let producto of productosVentaActual; let i = index" class="animated fadeIn faster">
        <div *ngIf="producto.ventaId == idVentaActivaInterno">
          <input 
            (change)="selectRow(producto.id)" 
            class="form-check-input" 
            type="radio" 
            name="productosRadioSelect" 
            [id]="producto.id" 
            [value]="producto.id" 
            [checked]="producto.id == rowSelected">
          
          <label [for]="producto.id" class="fila-producto" [ngClass]="i % 2 === 0 ? 'even' : 'odd'">
            <div class="col-codigo">
              <span class="texto-codigo">{{producto.codigoDeBarras}}</span>
            </div>
            <div class="col-descripcion">
              <span class="texto-descripcion">{{producto.descripcion}}</span>
            </div>
            <div class="col-precio">
              <span class="texto-precio">{{producto.precioVenta | currency: '$'}}</span>
            </div>
            <div class="col-cantidad">
              <div class="controles-cantidad">
                <button 
                  tabindex="-1" 
                  type="button" 
                  class="btn-cantidad-control" 
                  [disabled]="producto.seVende == 2 || producto.seVende == 0" 
                  (click)="restarCantidad(producto.id)">
                  <i class="fa fa-minus"></i>
                </button>
                <span class="valor-cantidad">{{producto.cantidad | number: producto.seVende == 2 ? '1.3' : '1.0'}}</span>
                <button 
                  tabindex="-1" 
                  type="button" 
                  class="btn-cantidad-control" 
                  [disabled]="producto.seVende == 2 || producto.seVende == 0" 
                  (click)="agregarCantidad(producto.id)">
                  <i class="fa fa-plus"></i>
                </button>
              </div>
            </div>
            <div class="col-importe">
              <strong class="texto-importe">{{producto.importe | currency: '$'}}</strong>
            </div>
          </label>
        </div>
      </div>
    </div>
  </div>
</div>

<footer class="footer-ventas">
    <app-ventas-footer (nuevaVenta)="crearNuevaVenta()" (obtenerVentasActivas)="obtenerVentasActivas($event)" [cambiandoDeVenta]="cambiandoDeVenta"></app-ventas-footer>
</footer>
</div>

<!-- MODAL PARA BUSQUEDA DE PRODUCTOS -->
<div style="display: none;"> 
  <div #modalBusquedaProductos>
    <app-buscar-productos [esVenta] = true></app-buscar-productos>    
  </div>
</div>

<!-- MODAL PARA PRODUCTO COMÚN -->
<div style="display: none;"> 
  <div #modalProductoComun>
      <app-producto-comun (insertar)="insertarProductoComun($event)"></app-producto-comun>    
  </div>
</div>

<!-- MODAL PARA ENTRADA DE DINERO -->
<div style="display: none;"> 
  <div #modalEntradaDinero>
      <app-entrada-dinero></app-entrada-dinero>    
  </div>
</div>

<!-- MODAL PARA SALIDA DE DINERO -->
<div style="display: none;"> 
  <div #modalSalidaDinero>
      <app-salida-dinero></app-salida-dinero>    
  </div>
</div>

<!-- MODAL VENTAS DEL DIA -->
<app-ventas-del-dia #modalVentasDelDia></app-ventas-del-dia>

<!-- BARRA DE ESTADO -->
<app-barra-estado (abrirVentasDelDia)="abrirVentasDelDia()"></app-barra-estado>
